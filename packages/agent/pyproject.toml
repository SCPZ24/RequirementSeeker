[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "requirementseeker-agent"
version = "0.1.0"
description = "Offline contracts for the RequirementSeeker Agent module"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
rs-agent = "requirementseeker_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/requirementseeker_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
